# Each contract is a tree drawn by the rail `indent` field: the rail still fills
# its cell and only its frame is inset, so the indent holds at every tier.
# Spacer indents were rejected: they left an interior hole on every row once the
# tracks collapsed at the 900px tier.
#
# The rails carry plain words; the real field and section names live in the
# details of the engine and audit boxes. In the real schema, verification, open
# gaps and reach (cross_layer_impacts) sit inside evidence_report; the tree lifts
# them beside evidence so its children are the five lists of what the agent saw
# and did. The 13 project sections are the ones the agent files declare in
# `project_context_contracts`; the code keeps no fixed registry of them. The
# project tree opens three of them with fields read from
# `gaia context get-contract` and folds the other ten into one rail.
id: p6-contracts
layout: grid
form: dashboard
columns: 1

filters:
  - key: c-reports
    label: "1 · it reports"
    steps:
      - "Every agent ends its turn with a report in the same form, starting with how it ended."
  - key: c-evidence
    label: "2 · with evidence"
    steps:
      - "The report carries the evidence: what it read, what it ran and what it found."
  - key: c-checked
    label: "3 · checked by rule"
    steps:
      - "Gaia checks the report by rule before anyone relies on it."
  - key: c-updates
    label: "4 · it updates the project"
    steps:
      - "A report can update what Gaia knows about the project, but only the parts that agent may write."
  - key: c-kept
    label: "5 · kept for audit"
    steps:
      - "And every report is kept, so the work can be audited later."

sections:
  - id: gaia
    title: "GAIA"
    treatment: [envelope]
    order: 1
    span: 1
    columns: 1
    children:
      - id: p6-kinds
        treatment: [plain]
        order: 1
        span: 1
        columns: 3
        children:
          - id: p6-agent-contract
            title: "Agent contract"
            subtitle: "one per turn"
            treatment: [envelope, compact]
            order: 1
            span: 1
            columns: 1
            children:
              - {id: ac-status, type: rail, order: 1, indent: 1, title: "how it ended", filters: [c-reports]}
              - {id: ac-complete, type: rail, order: 2, indent: 2, title: "done", filters: [c-reports]}
              - {id: ac-needs-verification, type: rail, order: 3, indent: 2, title: "needs a check", filters: [c-reports]}
              - {id: ac-approval-request, type: rail, order: 4, indent: 2, title: "needs your approval", filters: [c-reports]}
              - {id: ac-needs-input, type: rail, order: 5, indent: 2, title: "needs an answer", filters: [c-reports]}
              - {id: ac-blocked, type: rail, order: 6, indent: 2, title: "blocked", filters: [c-reports]}
              - {id: ac-in-progress, type: rail, order: 7, indent: 2, title: "still working", filters: [c-reports]}
              - {id: ac-evidence, type: rail, order: 8, indent: 1, title: "evidence", filters: [c-evidence]}
              - {id: ac-files, type: rail, order: 9, indent: 2, title: "files it read", filters: [c-evidence]}
              - {id: ac-patterns, type: rail, order: 10, indent: 2, title: "what it searched", filters: [c-evidence]}
              - {id: ac-commands, type: rail, order: 11, indent: 2, title: "commands it ran", filters: [c-evidence]}
              - {id: ac-key-outputs, type: rail, order: 12, indent: 2, title: "what it found", filters: [c-evidence]}
              - {id: ac-verbatim, type: rail, order: 13, indent: 2, title: "exact output", filters: [c-evidence]}
              - {id: ac-verification, type: rail, order: 14, indent: 1, title: "how it was checked", filters: [c-checked]}
              - {id: ac-gaps, type: rail, order: 15, indent: 1, title: "what is still open", filters: [c-kept]}
              - {id: ac-reach, type: rail, order: 16, indent: 1, title: "what else it touched", filters: [c-kept]}
              - {id: ac-approval, type: rail, order: 17, indent: 1, title: "the command to approve", filters: [c-kept]}
              - {id: ac-updates, type: rail, order: 18, indent: 1, title: "updates to the project", filters: [c-updates]}

          - id: p6-project
            title: "Project contract"
            subtitle: "one per workspace, by sections"
            treatment: [envelope, compact]
            order: 2
            span: 1
            columns: 1
            children:
              - {id: pc-identity, type: rail, order: 1, indent: 1, title: "identity", filters: [c-updates]}
              - {id: pc-name, type: rail, order: 2, indent: 2, title: "name", filters: [c-updates]}
              - {id: pc-path, type: rail, order: 3, indent: 2, title: "path", filters: [c-updates]}
              - {id: pc-repository, type: rail, order: 4, indent: 2, title: "repository", filters: [c-updates]}
              - {id: pc-language, type: rail, order: 5, indent: 2, title: "language", filters: [c-updates]}
              - {id: pc-type, type: rail, order: 6, indent: 2, title: "type", filters: [c-updates]}
              - {id: pc-stack, type: rail, order: 7, indent: 1, title: "stack", filters: [c-updates]}
              - {id: pc-languages, type: rail, order: 8, indent: 2, title: "languages", filters: [c-updates]}
              - {id: pc-frameworks, type: rail, order: 9, indent: 2, title: "frameworks", filters: [c-updates]}
              - {id: pc-build-tools, type: rail, order: 10, indent: 2, title: "build tools", filters: [c-updates]}
              - {id: pc-git, type: rail, order: 11, indent: 1, title: "git", filters: [c-updates]}
              - {id: pc-remotes, type: rail, order: 12, indent: 2, title: "remotes", filters: [c-updates]}
              - {id: pc-default-branch, type: rail, order: 13, indent: 2, title: "default branch", filters: [c-updates]}
              - {id: pc-branch-strategy, type: rail, order: 14, indent: 2, title: "branch strategy", filters: [c-updates]}
              - {id: pc-more, type: rail, order: 15, indent: 1, title: "… and 10 more sections", filters: [c-updates]}

          - id: p6-users
            title: "Who uses it"
            subtitle: "four readers, in order"
            treatment: [envelope]
            tokens:
              row:
                cell_h: 160
            order: 3
            span: 1
            columns: 1
            children:
              - id: p6-validates
                order: 1
                kicker: "VALIDATION"
                title: "1 · The engine checks it"
                description: ["by rule, never the reply text"]
                detail: "When the turn ends, a hook (SubagentStop) reads the stored contract and checks it by rule. A missing or unfinished one sends the specialist back, and only 'done' is final. Real field names: status, evidence (files_checked, patterns_checked, commands_run, key_outputs, verbatim_outputs), verification, open gaps, reach (cross_layer_impacts), approval, update_contracts."
                filters: [c-checked]
              - id: p6-reads
                order: 2
                title: "2 · The orchestrator reads it"
                description: ["and decides the next step"]
                detail: "It reads the stored contract, not the message, checks what it claims against what it can open itself, and takes the next step from the status: tell you, send a verifier, show you a command, ask you, or resume the turn."
                filters: [c-reports]
              - id: p6-verifier
                order: 3
                title: "3 · The verifier tests it"
                description: ["from the evidence alone"]
                detail: "A separate agent re-runs the checks from the evidence, without the context of the agent that did the work."
                filters: [c-evidence]
              - id: p6-kept
                order: 4
                title: "4 · It is kept"
                description: ["for the audit trail"]
                detail: "Every contract is stored and can be searched later. Each update to the project was checked against what that agent may write before it was saved. Real section names: project_identity, stack, environment, git, architecture_overview, workspace_repos, application_services, infrastructure, infrastructure_topology, gitops_configuration, cluster_details, operational_guidelines, releases. Each section is a small document of fields: some are filled by the scan, others by the agents allowed to write that section."
                filters: [c-kept]

      - id: prompt
        treatment: [plain, compact]
        tokens:
          row:
            cell_h: 60
        order: 2
        span: 1
        columns: 1
        children:
          - id: p6-prompt
            order: 1
            variant: accent
            kicker: "PROMPT"
            title: "How do your agents report back?"
            filters: [c-reports]
