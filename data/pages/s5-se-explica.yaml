# S5 — Gaia se explica a sí misma (closing act). A distinct NESTED form: an
# `envelope` frontier wraps a READ-LOOP of 3 steps (Pregunta → Localiza →
# Responde), traced by the `read-loop` chip. Below, a self-referential STRIP
# names the pillars with the SAME source files the deck cited across S0–S4
# (hooks.json · tiers.py · schema.sql · approval_grants.py ·
# context_provider.py) — the deck closing its own loop. A base honesty line
# states plainly there is no always-current autogenerated map.
#
# The second chip `fuente-de-verdad` ("gaia/ no .claude") lights the nodes that
# name the source: the Localiza step and the five pillar files — the truth is
# the source tree gaia/, read on demand, NOT the installed copy .claude.
id: s5-se-explica
layout: grid
form: flow
columns: 3

filters:
  - key: read-loop
    label: "el read-loop"
    steps:
      - "Preguntas en lenguaje natural → gaia-system localiza el pilar en la fuente → responde con el archivo real."
  - key: fuente-de-verdad
    label: "gaia/ no .claude"
    steps:
      - "La fuente de verdad es el árbol gaia/, leído al vuelo — no la copia instalada .claude, ni un mapa autogenerado."

sections:
  # Concept · the closing belief.
  - id: concept
    title: "Gaia se explica a sí misma"
    variant: good
    order: 1
    span: 3
    columns: 1
    children:
      - id: s5-concept
        kicker: EL CIERRE
        title: "Arquitectura autodescriptiva"
        description:
          - "en lenguaje natural, le preguntas a Gaia por Gaia"
          - "y responde leyendo su propia implementación"
        detail: "El recorrido cierra donde empezó: la forma de trabajar compartida es tan explícita que el propio sistema puede explicarla. Le preguntas por su arquitectura en lenguaje natural y responde leyendo su fuente."
        variant: accent

  # The read-loop · an envelope frontier wrapping 3 steps (chip = the arrow).
  - id: capacidad
    title: "Una capacidad viva, no un mapa estático"
    subtitle: "haz clic en «el read-loop» para trazarlo"
    treatment: [envelope]
    order: 2
    span: 3
    columns: 3
    children:
      - id: rl-pregunta
        order: 1
        kicker: 1 · PREGUNTA
        title: "Pregunta"
        description: ["en lenguaje natural"]
        detail: "Le preguntas a gaia-system por una pieza de la arquitectura en lenguaje natural — sin abrir el código tú mismo."
        filters: [read-loop]
      - id: rl-localiza
        order: 2
        kicker: 2 · LOCALIZA
        title: "Localiza"
        description: ["el pilar en el árbol fuente gaia/, no en .claude"]
        detail: "gaia-system localiza el pilar en el árbol fuente <code>gaia/</code> —la fuente de verdad—, no en la copia instalada <code>.claude</code>. Abre el archivo real, no su memoria."
        variant: accent
        filters: [read-loop, fuente-de-verdad]
      - id: rl-responde
        order: 3
        kicker: 3 · RESPONDE
        title: "Responde"
        description: ["explica con el archivo real"]
        detail: "Devuelve la explicación en lenguaje natural, anclada al archivo fuente que acaba de leer: la pieza nombrada y el archivo referenciado."
        filters: [read-loop]

  # Self-referential strip · the pillars, the same files the deck cited.
  - id: pilares
    title: "Los pilares — los mismos archivos que citó el recorrido"
    subtitle: "el deck cierra su propio loop"
    variant: neutral
    order: 3
    span: 3
    columns: 5
    children:
      - { id: pil-hooks, title: "hooks.json", variant: muted, filters: [fuente-de-verdad] }
      - { id: pil-tiers, title: "tiers.py", variant: muted, filters: [fuente-de-verdad] }
      - { id: pil-schema, title: "schema.sql", variant: muted, filters: [fuente-de-verdad] }
      - { id: pil-grants, title: "approval_grants.py", variant: muted, filters: [fuente-de-verdad] }
      - { id: pil-context, title: "context_provider.py", variant: muted, filters: [fuente-de-verdad] }

  # Base · the honesty line (a caption, not a card).
  - id: honest
    treatment: [plain]
    order: 4
    span: 3
    columns: 1
    children:
      - id: s5-honest
        type: separator
        style: dotted
        span: 1
        text: "no hay mapa autogenerado al día — architecture.json está obsoleto"
