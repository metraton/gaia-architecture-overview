# S3 — Human in the loop. The whole page now lives INSIDE one envelope section
# whose TITLE is the governing belief: «El humano decide solo cuando algo muta o
# cambia el estado en vivo». That container (columns:1) stacks the page's real
# content as bands: the T3 CYCLE (a timeline of 6 real states) and, beneath it,
# a ZOOM into the two moments the human touches — the risk ladder (T0–T3) and
# the approval dialog. The principle is no longer a loose caption/separator; it
# frames everything as the section header.
#
# Since a grid cannot draw edges, the cycle's arrow is the `loop` chip ("el
# ciclo T3"); a second cross-cutting chip `cadena` ("cadena inmutable") lights
# the two append-only nodes (REQUESTED génesis + EXECUTED/FAILED cierre). Both
# filters and every member are unchanged from the prior build.
#
# Form: timeline — the guardrail scopes M/L/E/N/P out (a timeline is one long
# row); O/U/Y/G/Q + all integrity invariants still apply. The container holds
# ONLY sub-sections (no leaf boxes mixed into its grid), so the G / sec-c1
# stacked-section overflow guard is respected.
#
# T0–T3 reframed against security-tiers/SKILL.md + reference.md: T0 read-only
# (runs free), T1 local validation, T2 simulation/dry-run (reads remote, never
# writes), T3 sensitive/irreversible mutation that does NOT blind-block — it
# opens an APPROVAL GATE at the point of change (alerts on mutation, demands
# consent, may proceed once approved).
id: s3-auditable
layout: grid
form: timeline
columns: 6

filters:
  - key: loop
    label: "the T3 cycle"
    steps:
      - "A mutation (T3) is classified, decided, approved, executed, and audited — the human in the loop."
  - key: cadena
    label: "immutable chain"
    steps:
      - "The append-only nodes: REQUESTED (genesis) and EXECUTED/FAILED (close) — the hash chain no one rewrites."
  - key: el-humano
    label: "the human"
    steps:
      - "the human decides only where it matters: only the Approval step and its dialog light up — the rest of the cycle runs without them."

sections:
  # ONE container envelope whose TITLE is the governing principle; it wraps ALL
  # page content as stacked bands (columns:1 → each child is a full-width band).
  - id: principio
    title: "The human decides only when something mutates or a live state changes"
    treatment: [envelope]
    order: 1
    span: 6
    columns: 1
    children:
      # 1 · EL CICLO T3 — the life of a T3 as a timeline of 6 real states
      # (chip `loop` = the arrow; `cadena` lights the two append-only nodes).
      - id: ciclo
        title: "The T3 cycle"
        subtitle: "click \"the T3 cycle\" to trace it"
        treatment: [envelope]
        order: 1
        span: 1
        columns: 6
        children:
          - id: t-mutacion
            order: 1
            kicker: command
            title: "Mutation"
            description: ["a command mutates state (e.g. git push)"]
            detail: "A command mutates live state — for example <code>git push</code>. It is the starting point of the cycle: something is about to change outside the session. Detected in <code>hooks/modules/security/mutative_verbs.py</code>."
            filters: [loop]
          - id: t-clasifica
            order: 2
            kicker: tiers
            title: "Classify"
            description: ["the hook measures the command's risk (T0-T3)"]
            detail: "The hook measures the operation's risk and classifies it by tier: T0 read, T1 validation, T2 dry-run, T3 sensitive mutation. Anchor: <code>hooks/modules/security/tiers.py</code>."
            filters: [loop]
          - id: t-decision
            order: 3
            kicker: REQUESTED
            title: "Decision"
            description: ["evaluates and breaks it down; if T3, emits REQUESTED"]
            detail: "The operation is evaluated and broken down; if it turns out to be T3 it is blocked and the <code>REQUESTED</code> event is emitted — the genesis of the chain. The fork by origin: a subagent receives <code>deny(approval_id)</code>; the orchestrator receives an <code>ask</code>."
            variant: accent
            filters: [loop, cadena]
          - id: t-aprueba
            order: 4
            kicker: "SHOWN · APPROVED"
            title: "Approval"
            description: ["the human sees the exact values and decides"]
            detail: "The human sees the exact values of the operation (the sealed payload) and decides: <code>SHOWN</code> → <code>APPROVED</code>. The grant is single-use, with a short TTL."
            filters: [loop, el-humano]
          - id: t-ejecuta
            order: 5
            kicker: EXECUTED
            title: "Execution"
            description: ["byte-for-byte retry; the single-use grant is consumed"]
            detail: "The command is retried byte-for-byte; the single-use grant is consumed when it matches the command's exact signature. The result is marked <code>EXECUTED</code>."
            filters: [loop]
          - id: t-audita
            order: 6
            kicker: append-only
            title: "Audit"
            description: ["EXECUTED/FAILED in the immutable hash chain"]
            detail: "The outcome is recorded as <code>EXECUTED</code> or <code>FAILED</code> in the append-only hash chain — the immutable trail no one rewrites. Substrate: <code>approval_events</code>."
            variant: accent
            filters: [loop, cadena]

      # 2 · ZOOM — the two moments the human touches, side by side (two inline
      # envelope sub-sections). LEFT zooms into «Clasifica» (the T0–T3 risk
      # ladder); RIGHT recreates the approval dialog (AskUserQuestion): the
      # sealed values shown, then the Sí/No decision.
      - id: zoom
        treatment: [plain]
        order: 2
        span: 1
        columns: 2
        children:
          # 2a · Clasifica · el riesgo — the tier ladder as a vertical stack.
          - id: clasifica
            title: "Classify · the risk"
            subtitle: "the tier measures how much the command risks"
            treatment: [envelope]
            span: 1
            columns: 1
            children:
              - id: z-t0
                kicker: free
                title: "T0 · read"
                description: ["reads: run free"]
                detail: "T0 · read: observes state without changing anything (get, list, describe, status). Runs free, with no friction and no consent needed."
                variant: good
              - id: z-t1
                kicker: local
                title: "T1 · validate"
                description: ["local validation, never touches remote"]
                detail: "T1 · local validation: checks without remote calls or state changes (validate, lint, fmt, check). Needs no consent."
              - id: z-t2
                kicker: dry-run
                title: "T2 · simulate"
                description: ["dry-run: reads remote, never writes"]
                detail: "T2 · simulation / dry-run: may read remote state, but never writes (plan, diff, template). Needs no consent."
                variant: warn
              - id: z-t3
                kicker: gate
                title: "T3 · gate"
                description: ["mutates: opens an approval gate"]
                detail: "T3 · sensitive or irreversible mutation: creates, updates, or destroys live state (apply, create, delete, push, deploy). Not a blind block: at the point of change it opens an approval GATE — it alerts that something is about to mutate and demands the human's consent; once approved, it proceeds."
                variant: bad

          # 2b · Aprobación · el diálogo — recreate the AskUserQuestion prompt:
          # the sealed values (stacked), then the Sí/No decision (two buttons).
          - id: aprobacion
            title: "Approval · the dialog"
            subtitle: "the human sees the exact values and decides"
            treatment: [envelope]
            span: 1
            columns: 1
            children:
              # the sealed values shown to the human
              - id: ap-campos
                treatment: [plain]
                span: 1
                columns: 1
                children:
                  - id: ap-op
                    title: "Operation"
                    description: ["what is about to run"]
                    detail: "<code>operation</code> — the named operation that is about to run."
                    variant: muted
                    filters: [el-humano]
                  - id: ap-content
                    title: "exact_content"
                    description: ["the command's exact bytes"]
                    detail: "<code>exact_content</code> — the exact, byte-for-byte content that will run. What gets approved is what runs: no surprises."
                    variant: muted
                    filters: [el-humano]
                  - id: ap-scope
                    title: "scope · risk · rollback"
                    description: ["scope, tier, and how to roll back"]
                    detail: "<code>scope</code>, <code>risk_level</code>, and <code>rollback_hint</code> — the operation's scope, its risk tier, and the hint for rolling it back."
                    variant: muted
                    filters: [el-humano]
              # the Yes/No decision, two buttons side by side
              - id: ap-decision
                treatment: [plain]
                span: 1
                columns: 2
                children:
                  - id: ap-approve
                    kicker: "yes"
                    title: "Approve"
                    description: ["consents: it runs"]
                    detail: "The human consents: the grant is issued and the command runs byte-for-byte."
                    variant: good
                    span: 1
                    filters: [el-humano]
                  - id: ap-reject
                    kicker: "no"
                    title: "Reject"
                    description: ["rejects: nothing happens"]
                    detail: "The human rejects: no grant is issued and the mutation does not happen."
                    variant: bad
                    span: 1
                    filters: [el-humano]
