# S2 — Estándares. Layer-2 build, full rewrite: two stacked sections replace
# the previous three-band layout (creencia caption + categorías + base
# captions are gone entirely).
#
# Form: dashboard. Two stacked full-width bands (each span == root columns 3):
#   1. IDENTIDAD DE LOS AGENTES — an envelope band (columns:6) holding the six
#      real components of a specialist's identity as green (variant: ok) boxes,
#      each carrying a one-line description, side by side in one row. Names
#      confirmed against agent-creation/SKILL.md
#      "Step 2: Apply the component inventory" (the six obligatory components
#      of a specialist):
#        1. project_context_contracts -> "Contrato"
#        2. Frontmatter                -> "Frontmatter"
#        3. Identity                   -> "Identidad" (the skill's own name
#           for this component; "Esencia" is a sub-concept INSIDE Identity —
#           "the shared essence plus the small subset" — not the component's
#           name, so the box uses the real name, "Identidad")
#        4. Workflow                   -> "Workflow"
#        5. Scope (CAN DO / CANNOT DO -> DELEGATE) -> "Scope / Delegación"
#        6. Failure handling / Domain Errors -> "Domain Errors"
#   2. SKILLS — an envelope band (columns:6) titled "Skills", subtitle "el
#      estándar es la salida", holding SIX inline sub-sections (span:1,
#      variant: envelope, columns:1) side by side in one row, each with its
#      own title and, stacked beneath it, its subcategories as title-only
#      boxes (variant: store) — same compound-grid shape as the old
#      categorías band, just renamed/recontented per the new brief, in this
#      exact order: Protocolos, Código, Convenciones, Documentación,
#      Lenguaje, Creación.
#
# A compound grid is a flex-wrap row that only wraps at the 120px floor (see
# reference.md), so 6 sections in one `columns:6` band render genuinely
# 6-across at wide tiers and collapse (…→2→1) below — expected, not a defect.
#
# FILTERS: `a-demanda` ("se cargan por descripción") traces the 6 category
# headers of the Skills band. Since a section header cannot carry a filter,
# the FIRST box of each of the 6 categories stands in for its header and
# carries `filters: [a-demanda]` — 6 members, no orphans.
#
# `protocolos` ("gobernado por protocolos") traces the cross-cutting claim
# that some components are themselves governed by protocols. Since the
# Protocolos category header cannot carry a filter, its stand-in box (pro-1,
# same role as the a-demanda pattern above) carries it alongside a-demanda.
# The other 3 members are real boxes in Identidad de los agentes: Contrato,
# Workflow, Scope / Delegación — 4 members total, no orphans.
#
# WHY word-fit safe (invariant N, dashboard-scoped): both bands use
# `columns:6` at span:3 (root columns:3), giving each cell the same ~213px
# width already validated safe in the prior build for tokens up to
# "Documentación" (13 chars) / "Pull requests" (14 chars) — well above every
# title here. No shortening was needed; titles are used in full.
id: s2-estandares
layout: grid
form: dashboard
columns: 3

filters:
  - key: a-demanda
    label: "loaded by description"
    steps:
      - "Each skill loads when its description matches the intent — not all at once, but on demand."
  - key: protocolos
    label: "governed by protocols"
    steps:
      - "Contract, Workflow, and Scope/Delegation in the agent's identity, plus the Protocols category in Skills, share the same axis: they are governed by protocols."
  - key: crea-identidad
    label: "creation → identity"
    steps:
      - "the creation template produces the agent's identity: Agent template, in the Creation category, is what gives rise to the six components of Agent Identity."

sections:
  # 1 · IDENTIDAD DE LOS AGENTES — the six real components of a specialist's
  # identity, confirmed against agent-creation's component inventory.
  - id: identidad
    title: "Agent identity"
    variant: envelope
    order: 1
    span: 3
    columns: 6
    children:
      - { id: id-contrato, title: "Contract", description: ["what it can read and write"], variant: ok, filters: [protocolos, crea-identidad] }
      - { id: id-frontmatter, title: "Frontmatter", description: ["declares routing, permissions, and surface"], variant: ok, filters: [crea-identidad] }
      - { id: id-identidad, title: "Identity", description: ["its essence and its own subset"], variant: ok, filters: [crea-identidad] }
      - { id: id-workflow, title: "Workflow", description: ["the steps to produce its work"], variant: ok, filters: [protocolos, crea-identidad] }
      - { id: id-scope, title: "Scope / Delegation", description: ["what it does and what it delegates to others"], variant: ok, filters: [protocolos, crea-identidad] }
      - { id: id-errors, title: "Domain Errors", description: ["how it handles failures in its domain"], variant: ok, filters: [crea-identidad] }

  # 2 · SKILLS — six sub-sections side by side, one row, each stacking its
  # subcategories as title-only boxes beneath its own title.
  - id: skills
    title: "Skills"
    subtitle: "The standard is the output"
    variant: envelope
    order: 2
    span: 3
    columns: 6
    children:
      # Protocols
      - id: cat-protocolos
        title: "Protocols"
        variant: envelope
        span: 1
        columns: 1
        children:
          - { id: pro-1, title: "Response", variant: store, filters: [a-demanda, protocolos] }
          - { id: pro-2, title: "Approval", variant: store }
          - { id: pro-3, title: "Execution", variant: store }
          - { id: pro-4, title: "Investigation", variant: store }

      # Code
      - id: cat-codigo
        title: "Code"
        variant: envelope
        span: 1
        columns: 1
        children:
          - { id: cod-1, title: "Patterns", variant: store, filters: [a-demanda] }
          - { id: cod-2, title: "Naming", variant: store }
          - { id: cod-3, title: "Comments", variant: store }
          - { id: cod-4, title: "Error handling", variant: store }

      # Conventions
      - id: cat-conv
        title: "Conventions"
        variant: envelope
        span: 1
        columns: 1
        children:
          - { id: conv-1, title: "Commits", variant: store, filters: [a-demanda] }
          - { id: conv-2, title: "Pull requests", variant: store }
          - { id: conv-3, title: "Branches", variant: store }
          - { id: conv-4, title: "Versioning", variant: store }

      # Documentation
      - id: cat-doc
        title: "Documentation"
        variant: envelope
        span: 1
        columns: 1
        children:
          - { id: doc-1, title: "README", variant: store, filters: [a-demanda] }
          - { id: doc-2, title: "Wiki", variant: store }
          - { id: doc-3, title: "Reference", variant: store }
          - { id: doc-4, title: "Changelog", variant: store }

      # Language
      - id: cat-leng
        title: "Language"
        variant: envelope
        span: 1
        columns: 1
        children:
          - { id: len-1, title: "Tickets", variant: store, filters: [a-demanda] }
          - { id: len-2, title: "Tone", variant: store }
          - { id: len-3, title: "Writing", variant: store }

      # Creation
      - id: cat-crea
        title: "Creation"
        variant: envelope
        span: 1
        columns: 1
        children:
          - { id: cre-1, title: "Skill template", variant: store, filters: [a-demanda] }
          - { id: cre-2, title: "Agent template", variant: store, filters: [crea-identidad] }
          - { id: cre-3, title: "Structure", variant: store }
          - { id: cre-4, title: "Triggers", variant: store }
