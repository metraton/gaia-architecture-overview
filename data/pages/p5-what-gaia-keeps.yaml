# Page 5 · What Gaia keeps (STORYBOARD.md rev 6). Four memories as four suns
# in a 2×2, in the order work flows, left to right then top to bottom: project
# (what Gaia knows before any work), operational (the work planned), execution
# (the work done), episodic (what it all left behind).
#
# Each sun is one untitled envelope holding a 4×3 leaf grid: the memory's name
# box spans the two middle cells of the middle row and its 10 words ring it on
# the 10 perimeter cells. A 5-column ring was tried to give "acceptance
# criteria" a two-cell slot, and rejected: five cells break the readable cell
# floor inside half the plane and the grid overflows its envelope. Instead a
# hue rail is set at 10.5px with no tracking, so 21 characters hold one line in
# one cell at 1920 (`check` RAILT asserts it). The words are rails in the
# memory's colour, in their authored case. The name box is title only; its
# question opens its detail.
#
# Each ring follows the lifecycle in the Gaia code, clockwise from top-left,
# and each rail's arrow points to the next cell: `→` after the word across the
# top, `↓` after it on the top-right corner and the right side, `←` before it
# across the bottom, `↑` before it on the bottom-left corner and the left side.
# `order` is the packing order, not the flow order: the bottom row is authored
# left to right, so its flow runs from order 11 back to order 8, and the left
# cell (order 5) closes the ring.
#
# Chips: `memory` is left off because every box here is memory. `deterministic`
# and `semantic` split the words: what the engine records or a rule decides,
# against what a model writes on purpose.
id: p5-what-gaia-keeps
layout: grid
form: dashboard
columns: 2

filters:
  - key: the-human
    label: "who decides?"
    steps:
      - "You do, and it is kept: the gates a plan must pass, the decisions and rules you set, and every approval a T3 command waited for."
  - key: nothing-self-declared
    label: "is it really done?"
    steps:
      - "Not because a turn says so: a task stays pending until a gate's verdict is pass, and the lineage says where each fact came from."
  - key: deterministic
    label: "what does a rule decide?"
    steps:
      - "What the engine records by itself or decides by rule: every session, turn, hook event, anomaly, episode and cut turn; the scan of your workspace and what each agent may read and write; a command's tier, a contract's verdict and the audit trail; a task's pending or blocked status."
  - key: semantic
    label: "what does a model follow?"
    steps:
      - "What a model writes on purpose, following its instructions: the brief, its acceptance criteria, the plan, its tasks and changes; the contract, its evidence, open gaps and final state; and the decisions, anchors, rules and preferences the orchestrator curates."
  - key: what-comes-back
    label: "what comes back next session?"
    steps:
      - "What the next session starts from: what was carried forward, the anchors of each project, and the events of the last 24 hours."
  - key: one-task
    label: "where does one task leave a trace?"
    steps:
      - "In all four memories: the task itself in operational memory, the contract that answered it in execution memory, the episode of its turn in episodic memory, and the sections of the project it read and wrote in project memory."

sections:
  - id: sun-project
    treatment: [envelope]
    order: 1
    span: 1
    columns: 4
    children:
      - { id: pr-scan, type: rail, order: 1, variant: blue, treatment: [centered], title: "scan →", filters: [deterministic] }
      - { id: pr-workspace, type: rail, order: 2, variant: blue, treatment: [centered], title: "workspace →", filters: [deterministic] }
      - { id: pr-repos, type: rail, order: 3, variant: blue, treatment: [centered], title: "repos →", filters: [deterministic] }
      - { id: pr-sections, type: rail, order: 4, variant: blue, treatment: [centered], title: "sections ↓", filters: [one-task] }
      - { id: pr-preferences, type: rail, order: 5, variant: blue, treatment: [centered], title: "↑ preferences", filters: [semantic] }
      - id: pr-core
        order: 6
        span: 2
        variant: blue
        treatment: [centered]
        title: "PROJECT MEMORY"
        filters: [one-task]
        detail: "<b>What do we know about the project, and about you?</b><br><br>What Gaia knows about the project, and about you. gaia scan maps the workspace and its repos; what it finds is kept in named sections of the project contract: project identity, stack, git, architecture, services, environment, infrastructure. Each agent may read some sections and write others, and its context at dispatch names them. About you: your rules and preferences, handed to every specialist at birth, and the decisions and anchors the orchestrator curated. Also kept here: feedback on how work went, and what did not work, as curated rows of type negative. Commands: gaia scan, gaia context, gaia memory."
      - { id: pr-can-read, type: rail, order: 7, variant: blue, treatment: [centered], title: "can read ↓", filters: [deterministic] }
      - { id: pr-your-rules, type: rail, order: 8, variant: blue, treatment: [centered], title: "↑ your rules", filters: [the-human, semantic] }
      - { id: pr-anchors, type: rail, order: 9, variant: blue, treatment: [centered], title: "← anchors", filters: [what-comes-back, semantic] }
      - { id: pr-decisions, type: rail, order: 10, variant: blue, treatment: [centered], title: "← decisions", filters: [the-human, semantic] }
      - { id: pr-can-write, type: rail, order: 11, variant: blue, treatment: [centered], title: "← can write", filters: [deterministic] }

  - id: sun-operational
    treatment: [envelope]
    order: 2
    span: 1
    columns: 4
    children:
      - { id: op-brief, type: rail, order: 1, variant: gold, treatment: [centered], title: "brief →", filters: [semantic] }
      - { id: op-ac, type: rail, order: 2, variant: gold, treatment: [centered], title: "acceptance criteria →", filters: [semantic] }
      - { id: op-plan, type: rail, order: 3, variant: gold, treatment: [centered], title: "plan →", filters: [semantic] }
      - { id: op-tasks, type: rail, order: 4, variant: gold, treatment: [centered], title: "tasks ↓", filters: [one-task, semantic] }
      - { id: op-carry-forward, type: rail, order: 5, variant: gold, treatment: [centered], title: "↑ carry forward", filters: [what-comes-back, semantic] }
      - id: op-core
        order: 6
        span: 2
        variant: gold
        treatment: [centered]
        title: "OPERATIONAL MEMORY"
        filters: [one-task]
        detail: "<b>What are we doing, and what is still open?</b><br><br>What is in flight and what is still open. A brief carries acceptance criteria and milestones; it gets one plan of tasks. Each task can depend on others, says which criteria it covers, and carries gates that someone who did not do the work checks. A plan can be paused, resumed, or changed through a managed plan change that keeps every earlier version. Also kept here: the statuses draft, open and in progress; open threads; schedules for recurring work and the notifications they leave; and each turn's next action. Commands: gaia brief, gaia ac, gaia milestone, gaia plan, gaia task, gaia schedule, gaia notifications."
      - { id: op-gates, type: rail, order: 7, variant: gold, treatment: [centered], title: "gates ↓", filters: [the-human] }
      - { id: op-plan-change, type: rail, order: 8, variant: gold, treatment: [centered], title: "↑ plan change", filters: [semantic] }
      - { id: op-pause, type: rail, order: 9, variant: gold, treatment: [centered], title: "← pause", filters: [semantic] }
      - { id: op-blocked, type: rail, order: 10, variant: gold, treatment: [centered], title: "← blocked", filters: [deterministic] }
      - { id: op-pending, type: rail, order: 11, variant: gold, treatment: [centered], title: "← pending", filters: [nothing-self-declared, deterministic] }

  - id: sun-execution
    treatment: [envelope]
    order: 3
    span: 1
    columns: 4
    children:
      - { id: ex-contracts, type: rail, order: 1, variant: clay, treatment: [centered], title: "contracts →", filters: [one-task, semantic] }
      - { id: ex-t3, type: rail, order: 2, variant: clay, treatment: [centered], title: "T3 →", filters: [the-human, deterministic] }
      - { id: ex-approvals, type: rail, order: 3, variant: clay, treatment: [centered], title: "approvals →", filters: [the-human] }
      - { id: ex-evidence, type: rail, order: 4, variant: clay, treatment: [centered], title: "evidence ↓", filters: [semantic] }
      - { id: ex-audit-trail, type: rail, order: 5, variant: clay, treatment: [centered], title: "↑ audit trail", filters: [deterministic] }
      - id: ex-core
        order: 6
        span: 2
        variant: clay
        treatment: [centered]
        title: "EXECUTION MEMORY"
        filters: [one-task]
        detail: "<b>What did we execute, and what did it produce?</b><br><br>What was executed, and what it produced. Every turn answers in its agent contract: its state (COMPLETE, BLOCKED, APPROVAL_REQUEST, NEEDS_VERIFICATION, NEEDS_INPUT, IN_PROGRESS), its evidence (commands run, key outputs, open gaps) and its verification, pass or fail. A gate's verdict is kept with its task. Every approval is kept in a hashed approval chain; every command's tier is decided by a rule: T0 read, T1 validate, T2 dry run, T3 change, or never. A compliance score and an audit trail are computed from all of it. Also kept here: metrics, and the worktree of each turn that wrote. Commands: gaia contract, gaia approvals, gaia evidence, gaia metrics."
      - { id: ex-open-gaps, type: rail, order: 7, variant: clay, treatment: [centered], title: "open gaps ↓", filters: [semantic] }
      - { id: ex-blocked, type: rail, order: 8, variant: clay, treatment: [centered], title: "↑ BLOCKED", filters: [semantic] }
      - { id: ex-complete, type: rail, order: 9, variant: clay, treatment: [centered], title: "← COMPLETE", filters: [semantic] }
      - { id: ex-pass, type: rail, order: 10, variant: clay, treatment: [centered], title: "← pass", filters: [nothing-self-declared] }
      - { id: ex-verdict, type: rail, order: 11, variant: clay, treatment: [centered], title: "← verdict", filters: [nothing-self-declared, deterministic] }

  - id: sun-episodic
    treatment: [envelope]
    order: 4
    span: 1
    columns: 4
    children:
      - { id: ep-sessions, type: rail, order: 1, variant: violet, treatment: [centered], title: "sessions →", filters: [deterministic] }
      - { id: ep-turns, type: rail, order: 2, variant: violet, treatment: [centered], title: "turns →", filters: [deterministic] }
      - { id: ep-hooks, type: rail, order: 3, variant: violet, treatment: [centered], title: "hooks →", filters: [deterministic] }
      - { id: ep-events, type: rail, order: 4, variant: violet, treatment: [centered], title: "events ↓", filters: [deterministic] }
      - { id: ep-last-24h, type: rail, order: 5, variant: violet, treatment: [centered], title: "↑ last 24h", filters: [what-comes-back, deterministic] }
      - id: ep-core
        order: 6
        span: 2
        variant: violet
        treatment: [centered]
        title: "EPISODIC MEMORY"
        filters: [one-task]
        detail: "<b>What happened, and when?</b><br><br>What happened and when, recorded by the engine, never written by hand. Every hook that fires leaves an event: SessionStart, SubagentStart, PostToolUse, SubagentStop and the rest. Every turn leaves one episode; sessions group them, and a timeline puts them in order. The next session starts with the last 24 hours. A turn that never closed stays as a cut turn, with its reason; anomalies and defects are listed one by one for triage. Also kept here: the transcript, the history of recent sessions, the backstop that closes a cut turn, the compaction of a long session, and the links between curated rows (supersedes, graduated). Commands: gaia query, gaia history, gaia defects, gaia memory search."
      - { id: ep-anomalies, type: rail, order: 7, variant: violet, treatment: [centered], title: "anomalies ↓", filters: [deterministic] }
      - { id: ep-lineage, type: rail, order: 8, variant: violet, treatment: [centered], title: "↑ lineage", filters: [nothing-self-declared, deterministic] }
      - { id: ep-timeline, type: rail, order: 9, variant: violet, treatment: [centered], title: "← timeline", filters: [deterministic] }
      - { id: ep-cut-turns, type: rail, order: 10, variant: violet, treatment: [centered], title: "← cut turns", filters: [deterministic] }
      - { id: ep-episodes, type: rail, order: 11, variant: violet, treatment: [centered], title: "← episodes", filters: [one-task, deterministic] }

  - id: keeps-close
    treatment: [plain]
    order: 5
    span: 2
    columns: 1
    children:
      - id: keeps-close-line
        type: separator
        order: 1
        text: "you decide what is curated · the engine records the rest"
