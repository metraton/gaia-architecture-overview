# Every memory uses the same three bands, so the four read as one grammar:
# how it fills (the only band with arrows, because only there is the order
# real), what you find, and who writes it. Rails carry no detail, and a box
# would make its row 60px tall, so this mock carries no per-memory detail.
# Section frames take no categorical colour (SECTION_VARIANTS is neutral, good,
# bad), so each memory's hue is carried by its rails.
# At the 900px tier a 4-column grid becomes 2 tracks and a span-2 item becomes
# span 1, so every band holds an even number of items; a spacer closes the
# bands whose content is odd.
id: p5-what-gaia-keeps
layout: grid
form: dashboard
columns: 1

filters:
  - key: p5-knows
    label: "1 · what it knows"
    steps:
      - "Gaia scans your projects and writes down what it finds, section by section; the specialists ask for changes to their own sections, and the orchestrator keeps your rules and decisions."
  - key: p5-open
    label: "2 · what is open"
    steps:
      - "Bigger work starts as a brief with its criteria, becomes a plan of tasks with their gates, and a verifier that did not do the work closes each task."
  - key: p5-done
    label: "3 · what was done"
    steps:
      - "A handed-over task is born with a contract that the specialist fills with evidence and closes, and Gaia's engine records every approval."
  - key: p5-happened
    label: "4 · what happened"
    steps:
      - "Only the engine writes it: every hook leaves an event, anything unusual is flagged, and each turn becomes one episode."
  - key: p5-one-task
    label: "5 · one task, four traces"
    steps:
      - "A single task leaves a trace in all four: in the project's sections, in the tasks of its plan, in the contract it was born with, and in the episode of its turn."

sections:
  - id: gaia
    title: "GAIA"
    subtitle: "▲ written on purpose · ▼ recorded as the work happens"
    treatment: [envelope]
    order: 1
    span: 1
    columns: 1
    children:
      - id: mem-top
        treatment: [plain]
        order: 1
        span: 1
        columns: 2
        children:
          - id: sun-project
            title: "Project memory"
            subtitle: "what do we know about the project, and about you?"
            treatment: [envelope, compact]
            tokens:
              row:
                cell_h: 60
            order: 1
            span: 1
            columns: 4
            children:
              - { id: pr-band-fills, type: separator, order: 1, span: 4, text: "how it fills" }
              - { id: pr-scan, type: rail, order: 2, variant: blue, treatment: [centered], title: "scan →", filters: [p5-knows] }
              - { id: pr-sections, type: rail, order: 3, variant: blue, treatment: [centered], title: "sections →", filters: [p5-knows, p5-one-task] }
              - { id: pr-your-rules, type: rail, order: 4, variant: blue, treatment: [centered], title: "your rules", filters: [p5-knows] }
              - { id: pr-fills-end, type: spacer, order: 4.5 }
              - { id: pr-band-find, type: separator, order: 5, span: 4, text: "what you find" }
              - { id: pr-identity, type: rail, order: 6, variant: blue, treatment: [centered], title: "identity", filters: [p5-knows] }
              - { id: pr-stack, type: rail, order: 7, variant: blue, treatment: [centered], title: "stack", filters: [p5-knows] }
              - { id: pr-git, type: rail, order: 8, variant: blue, treatment: [centered], title: "git", filters: [p5-knows] }
              - { id: pr-more, type: rail, order: 9, variant: blue, treatment: [centered], title: "+10 sections", filters: [p5-knows] }
              - { id: pr-preferences, type: rail, order: 10, variant: blue, treatment: [centered], title: "preferences", filters: [p5-knows] }
              - { id: pr-decisions, type: rail, order: 11, variant: blue, treatment: [centered], title: "decisions", filters: [p5-knows] }
              - { id: pr-failed, type: rail, order: 12, variant: blue, treatment: [centered], title: "what failed", filters: [p5-knows] }
              - { id: pr-find-end, type: spacer, order: 12.5 }
              - { id: pr-band-writers, type: separator, order: 13, span: 4, text: "written by" }
              - { id: pr-by-scan, type: rail, order: 14, variant: blue, treatment: [centered], title: "scan", filters: [p5-knows] }
              - { id: pr-by-agents, type: rail, order: 15, variant: blue, treatment: [centered], title: "specialist agents", filters: [p5-knows] }
              - { id: pr-by-orchestrator, type: rail, order: 16, variant: blue, treatment: [centered], title: "orchestrator", filters: [p5-knows] }
              - { id: pr-writers-end, type: spacer, order: 17 }

          - id: sun-operational
            title: "Operational memory"
            subtitle: "what are we doing, and what is still open?"
            treatment: [envelope, compact]
            tokens:
              row:
                cell_h: 60
            order: 2
            span: 1
            columns: 4
            children:
              - { id: op-band-fills, type: separator, order: 1, span: 4, text: "how it fills" }
              - { id: op-brief, type: rail, order: 2, variant: gold, treatment: [centered], title: "brief →", filters: [p5-open] }
              - { id: op-ac, type: rail, order: 3, variant: gold, treatment: [centered], title: "criteria →", filters: [p5-open] }
              - { id: op-plan, type: rail, order: 4, variant: gold, treatment: [centered], title: "plan →", filters: [p5-open] }
              - { id: op-tasks, type: rail, order: 5, variant: gold, treatment: [centered], title: "tasks →", filters: [p5-open, p5-one-task] }
              - { id: op-gates, type: rail, order: 6, span: 2, variant: gold, treatment: [centered], title: "gates →", filters: [p5-open] }
              - { id: op-verdict, type: rail, order: 7, span: 2, variant: gold, treatment: [centered], title: "verdict", filters: [p5-open] }
              - { id: op-band-find, type: separator, order: 8, span: 4, text: "what you find" }
              - { id: op-plan-change, type: rail, order: 9, variant: gold, treatment: [centered], title: "plan changes", filters: [p5-open] }
              - { id: op-pause, type: rail, order: 10, variant: gold, treatment: [centered], title: "paused plans", filters: [p5-open] }
              - { id: op-pending, type: rail, order: 11, variant: gold, treatment: [centered], title: "pending gates", filters: [p5-open] }
              - { id: op-threads, type: rail, order: 12, variant: gold, treatment: [centered], title: "open threads", filters: [p5-open] }
              - { id: op-band-writers, type: separator, order: 13, span: 4, text: "written by" }
              - { id: op-by-orchestrator, type: rail, order: 14, variant: gold, treatment: [centered], title: "orchestrator", filters: [p5-open] }
              - { id: op-by-planner, type: rail, order: 15, variant: gold, treatment: [centered], title: "planner", filters: [p5-open] }
              - { id: op-by-verifier, type: rail, order: 16, variant: gold, treatment: [centered], title: "verifier", filters: [p5-open] }
              - { id: op-writers-end, type: spacer, order: 17 }

      - id: mem-bottom
        treatment: [plain]
        order: 3
        span: 1
        columns: 2
        children:
          - id: sun-execution
            title: "Execution memory"
            subtitle: "what did we do, and what came out of it?"
            treatment: [envelope, compact]
            tokens:
              row:
                cell_h: 60
            order: 1
            span: 1
            columns: 4
            children:
              - { id: ex-band-fills, type: separator, order: 1, span: 4, text: "how it fills" }
              - { id: ex-born, type: rail, order: 2, variant: clay, treatment: [centered], title: "contract born →", filters: [p5-done, p5-one-task] }
              - { id: ex-evidence, type: rail, order: 3, variant: clay, treatment: [centered], title: "evidence →", filters: [p5-done] }
              - { id: ex-approval, type: rail, order: 4, variant: clay, treatment: [centered], title: "approval →", filters: [p5-done] }
              - { id: ex-closes, type: rail, order: 5, variant: clay, treatment: [centered], title: "contract closes", filters: [p5-done] }
              - { id: ex-band-find, type: separator, order: 6, span: 4, text: "what you find" }
              - { id: ex-states, type: rail, order: 7, span: 2, variant: clay, treatment: [centered], title: "done · blocked · needs check", filters: [p5-done] }
              - { id: ex-outputs, type: rail, order: 8, variant: clay, treatment: [centered], title: "commands & outputs", filters: [p5-done] }
              - { id: ex-open-gaps, type: rail, order: 9, variant: clay, treatment: [centered], title: "open gaps", filters: [p5-done] }
              - { id: ex-approvals, type: rail, order: 10, span: 2, variant: clay, treatment: [centered], title: "approval chain", filters: [p5-done] }
              - { id: ex-audit-trail, type: rail, order: 11, variant: clay, treatment: [centered], title: "audit trail", filters: [p5-done] }
              - { id: ex-find-end, type: spacer, order: 11.5 }
              - { id: ex-band-writers, type: separator, order: 12, span: 4, text: "written by" }
              - { id: ex-by-agents, type: rail, order: 13, variant: clay, treatment: [centered], title: "specialist agents", filters: [p5-done] }
              - { id: ex-by-engine, type: rail, order: 14, variant: clay, treatment: [centered], title: "Gaia engine", filters: [p5-done] }
              - { id: ex-writers-end, type: spacer, order: 15, span: 2 }

          - id: sun-episodic
            title: "Episodic memory"
            subtitle: "what happened, and when?"
            treatment: [envelope, compact]
            tokens:
              row:
                cell_h: 60
            order: 2
            span: 1
            columns: 4
            children:
              - { id: ep-band-fills, type: separator, order: 1, span: 4, text: "how it fills" }
              - { id: ep-hooks, type: rail, order: 2, variant: violet, treatment: [centered], title: "hooks →", filters: [p5-happened] }
              - { id: ep-events, type: rail, order: 3, variant: violet, treatment: [centered], title: "events →", filters: [p5-happened] }
              - { id: ep-anomalies, type: rail, order: 4, variant: violet, treatment: [centered], title: "anomalies →", filters: [p5-happened] }
              - { id: ep-episodes, type: rail, order: 5, variant: violet, treatment: [centered], title: "one episode per turn", filters: [p5-happened, p5-one-task] }
              - { id: ep-band-find, type: separator, order: 6, span: 4, text: "what you find" }
              - { id: ep-sessions, type: rail, order: 7, variant: violet, treatment: [centered], title: "sessions", filters: [p5-happened] }
              - { id: ep-cut-turns, type: rail, order: 8, variant: violet, treatment: [centered], title: "cut turns", filters: [p5-happened] }
              - { id: ep-defects, type: rail, order: 9, span: 2, variant: violet, treatment: [centered], title: "defects", filters: [p5-happened] }
              - { id: ep-recent, type: rail, order: 10, span: 2, variant: violet, treatment: [centered], title: "recent events", filters: [p5-happened] }
              - { id: ep-lineage, type: rail, order: 11, variant: violet, treatment: [centered], title: "history", filters: [p5-happened] }
              - { id: ep-find-end, type: spacer, order: 11.5 }
              - { id: ep-band-writers, type: separator, order: 12, span: 4, text: "written by" }
              - { id: ep-by-engine, type: rail, order: 13, variant: violet, treatment: [centered], title: "Gaia engine", filters: [p5-happened] }
              - { id: ep-writers-end, type: spacer, order: 14 }
              - { id: ep-writers-tail, type: spacer, order: 15, span: 2 }

      - id: prompt
        treatment: [plain, compact]
        tokens:
          row:
            cell_h: 60
        order: 4
        span: 1
        columns: 1
        children:
          - id: p5-prompt
            order: 1
            variant: accent
            kicker: "PROMPT"
            title: "What do you know about my work?"
            filters: [p5-knows]
