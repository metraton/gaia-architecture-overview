# S0 — La visión (apertura, voz del usuario). Layer 2 build.
# Form: dashboard. Three stacked bands (each span == root columns 2):
#   1. TOP band «Forma de trabajo compartida» — 3 boxes side by side
#      (columns:3): the shared premise that frames everything below.
#   2. CONTRAST band (sin nombre, variant plain = frameless wrapper, columns:2)
#      holding TWO inline sub-sections side by side, each columns:1 (a column
#      that grows downward). The layout is SYMMETRIC (5 vs 5, fixed --cell-h
#      rows → equal height), but the CONTENT is deliberately asymmetric and
#      that asymmetry ENCODES the idea: LEFT carries the substance (title +
#      one line + a real code anchor in `detail`), RIGHT is title-only —
#      "da igual la herramienta". The emptiness on the right is the message.
#   3. PAYOFF band — a thin dotted separator with a centered caption at the
#      base. Subtle by design (a labeled line, not a card) so it does not
#      steal focus from the contrast above.
#
# WHY nested (a contrast wrapper with two sub-sections) and not two root
# sections: the whole bottom is ONE idea — substance vs interchangeable — so
# it groups under one (unnamed, frameless) section; the two halves are its
# distinct parts. No filters: the 3 top boxes are peers (not a flow) and the
# 5 left pieces are peers (not a directional sequence), so no chip earns place.
#
# WHY dashboard + word-fit safe: columns:3 top band gives ~410px cells and
# columns:1 sub-sections give ~600px cells side by side (wider when stacked),
# far above the longest title token ("Aprobaciones" ~108px, "herramientas"),
# so no mid-word break (invariant N stays green).
id: s0-vision
layout: grid
form: dashboard
columns: 2

sections:
  # 1 · TOP band — the shared premise. Three aspects of one shared thing.
  - id: shared
    title: "A shared way of working"
    variant: safe
    order: 1
    span: 2
    columns: 3
    children:
      - id: sh-flujos
        status: SHARED
        title: "Same flows"
        description: ["the same way to move work forward"]
        variant: ok
      - id: sh-tools
        status: SHARED
        title: "Same tools"
        description: ["the same instruments for everyone"]
        variant: ok
      - id: sh-skills
        status: SHARED
        title: "Same skills"
        description: ["the same techniques, loaded on demand"]
        variant: ok

  # 2 · CONTRAST band — sin nombre, frameless wrapper holding two columns.
  - id: contrast
    variant: plain
    order: 2
    span: 2
    columns: 2
    children:
      # LEFT · the substance — what matters. Each box carries a real anchor.
      - id: flujos
        title: "Workflows"
        subtitle: "what matters"
        variant: normal
        span: 1
        columns: 1
        children:
          - id: f-state
            status: STATES
            title: "State Machine"
            description: ["legal turn states; no one self-declares \"done\""]
            detail: "The state machine lives in <code>hooks/modules/agents/state_tracker.py</code>: <code>_LEGAL_TRANSITIONS</code> defines the valid transitions, with a cap of 2 retries. <code>NEEDS_VERIFICATION</code> can only be promoted by a blind verifier — no one self-declares \"done\"."
            variant: strong
          - id: f-security
            status: SECURITY
            title: "Security Tiers + Approvals"
            description: ["classifies T0-T3 and asks for your consent before mutating"]
            detail: "Every operation is classified T0-T3 in <code>hooks/modules/security/tiers.py</code>; a T3 mutation requires your explicit consent, managed by <code>approval_grants.py</code>, before it runs."
            variant: strong
          - id: f-routing
            status: ROUTING
            title: "Surface Routing"
            description: ["maps intent to the right agent"]
            detail: "The router maps the prompt's intent to the surface and the specialist who owns it. Per-surface scoring lives in <code>tools/context/surface_router.py</code> (<code>_score_surface</code>)."
            variant: strong
          - id: f-planning
            status: PLANNING
            title: "Planning"
            description: ["breaks down and persists the work beyond the turn"]
            detail: "Work is broken down and persisted outside the turn: <code>gaia/state/transitions.py</code> and the <code>task_gates</code> table, where each gate carries a <code>verification_type</code> from the enum <code>command | code | semantic | self_review</code>."
            variant: strong
          - id: f-verify
            status: VERIFY
            title: "Verification"
            description: ["independent verification — no one validates their own work"]
            detail: "Every gate in <code>task_gates</code> carries a <code>verification_type</code> from the enum <code>command | code | semantic | self_review</code>. The gate is bound to the <code>plan_task_id</code>, not the role (<code>_blind_verification_required</code>)."
            variant: strong

      # RIGHT · interchangeable — the tool does not matter. Title-only, by design.
      - id: tools
        title: "Tools · it does not matter"
        subtitle: "interchangeable"
        variant: envelope
        span: 1
        columns: 1
        children:
          - id: t-claude
            title: "Claude Code"
            variant: ext
          - id: t-codex
            title: "Codex"
            variant: ext
          - id: t-cursor
            title: "Cursor"
            variant: ext
          - id: t-opencode
            title: "OpenCode"
            variant: ext
          - id: t-aider
            title: "Aider"
            variant: ext

  # 3 · PAYOFF band — a thin labeled line at the base (subtle, not a card).
  - id: payoff
    variant: plain
    order: 3
    span: 2
    columns: 1
    children:
      - id: p-line
        type: separator
        style: dotted
        span: 1
        text: "more and better products · safer and more robust"
